services:
  reverse-proxy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/theiakshi-data/caddy/data:/data
      - /srv/theiakshi-data/caddy/config:/config
    env_file:
      - .env.self-hosted
    networks:
      - proxy-net
    depends_on:
      - website
      - hrms-frontend
      - backend

  website:
    build:
      context: ./website
    image: theiakshi-website:latest
    container_name: theiakshi-website
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - proxy-net

  hrms-frontend:
    build:
      context: ./frontend
    image: theiakshi-hrms-frontend:latest
    container_name: theiakshi-hrms-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - proxy-net
      - app-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: theiakshi-hrms-backend:latest
    container_name: theiakshi-hrms-backend
    restart: unless-stopped
    env_file:
      - .env.self-hosted
    volumes:
      - /srv/theiakshi-data/uploads:/app/uploads
      - /srv/theiakshi-data/backups:/app/backups:ro
      - /srv/theiakshi-data/secrets/google_drive_backup.env:/app/secrets/google_drive_backup.env:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - proxy-net
      - app-net
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: theiakshi-postgres
    restart: unless-stopped
    env_file:
      - .env.self-hosted
    volumes:
      - /srv/theiakshi-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    container_name: theiakshi-redis
    restart: unless-stopped
    command: /bin/sh -c 'redis-server --requirepass "$${REDIS_PASSWORD}"'
    env_file:
      - .env.self-hosted
    volumes:
      - /srv/theiakshi-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

networks:
  proxy-net:
    driver: bridge
  app-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
