services:
  hrms-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: theiakshi-hrms-backend:latest
    container_name: theiakshi-hrms-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /srv/app-data/hrms/uploads:/app/uploads
      - /srv/theiakshi-data/backups:/app/backups:ro
      - /srv/theiakshi-data/secrets/google_drive_backup.env:/app/secrets/google_drive_backup.env:ro
    security_opt:
      - no-new-privileges:true
    expose:
      - "5000"
    networks:
      - theiakshi-internal

  hrms-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: theiakshi-hrms-frontend:latest
    container_name: theiakshi-hrms-frontend
    restart: unless-stopped
    depends_on:
      - hrms-backend
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8085:80"
    networks:
      - theiakshi-internal

networks:
  theiakshi-internal:
    external: true
    name: theiakshi-internal
