services:
  # 1. Backend Web Service
  - type: web
    name: theiakshi-hrms-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: theiakshi-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://ransom-1-npfy.onrender.com,https://theiakshi-hrms-frontend.onrender.com

  # 2. Frontend Static Site
  - type: static
    name: theiakshi-hrms-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ransom-eetj.onrender.com
